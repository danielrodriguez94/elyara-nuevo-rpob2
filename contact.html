</head><body>

<header class="site-header">
  <div class="shell nav">
    <a class="brand" href="index.html"><img src="assets/elyara-logo.png" alt="ELYARA Creative"></a>
    <nav class="nav-links desktop"><a class="" href="index.html" data-t="home"></a><a class="" href="services.html" data-t="services"></a><a class="" href="portfolio.html" data-t="portfolio"></a><a class="" href="about.html" data-t="about"></a><a class="active" href="contact.html" data-t="contact"></a></nav>

      <button class="menu-btn" data-menu>☰</button>
    </div>
  </div>
  <nav class="mobile-menu" data-mobile>
    <a href="index.html" data-t="home"></a><a href="services.html" data-t="services"></a><a href="portfolio.html" data-t="portfolio"></a><a href="about.html" data-t="about"></a><a href="contact.html" data-t="contact"></a>
    <a href="login.html" data-auth-label data-t="login"></a>
  </nav>
</header>
<main>
<section class="section section--soft"><div class="shell contact-grid">
<div class="reveal"><div class="kicker" data-t="contact_kicker"></div><h1 class="page-title" data-t="contact_title"></h1><p class="lead" data-t="contact_body"></p>
<div class="contact-list">
<div class="contact-row"><i>✉</i><a href="mailto:Info@eliaracreative.com">Info@eliaracreative.com</a></div>
<div class="contact-row"><i>✉</i><a href="mailto:Chris@elyaracreative.com">Chris@elyaracreative.com</a></div>
<div class="contact-row"><i>✉</i><a href="mailto:Daniel@elyaracreative.com">Daniel@elyaracreative.com</a></div>
</div></div>
<form class="contact-card form reveal" data-contact-form>
<input name="first_name" placeholder="First name / Nombre" required>
<input name="last_name" placeholder="Last name / Apellido" required>
<input class="full" name="email" type="email" placeholder="Email" required>
<select class="full" name="service">
<option value="">Service / Servicio</option>
<option value="essential_website">Essential Website / Sitio web esencial</option>
<option value="business_website">Business Website / Sitio web empresarial</option>
<option value="professional_website">Professional Website / Sitio web profesional</option>
<option value="advanced_website">Custom Website / Sitio web personalizado</option>
<option value="digital_card">Digital Business Card / Tarjeta digital</option>
<option value="social_flyer">Social Media Flyer / Flyer</option>
<option value="digital_menu_1">Digital Menu / Menú digital</option>
<option value="marketing">Digital Marketing / Marketing digital</option>
<option value="other">Other / Otro</option>
</select>
<textarea name="message" placeholder="Tell us about your project / Cuéntanos sobre tu proyecto" required></textarea>
<button class="btn btn--olive full" type="submit" data-t="send"></button>
</form></div></section></main>

  </div>
</footer>
